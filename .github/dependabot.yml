version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Isolate cryptographic dependencies for explicit validation
    ignore:
      - dependency-name: "@noble/*"
      - dependency-name: "bcryptjs"
    groups:
      runtime-dependencies:
        patterns:
          - "next"
          - "react*"
      tooling-dependencies:
        patterns:
          - "worker-build"
          - "webpack*"

  # Separate strict track for security-critical packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-name: "@noble/*"
      - dependency-name: "bcryptjs"
    labels:
      - "security-review-required"
      - "crypto-dependency"
