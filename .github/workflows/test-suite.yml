name: Test Suite (Manual)

# The mandatory PR pipeline lives in ci.yml.
# This workflow is retained only as an explicit manual recovery/debug entry point
# and must not create an additional merge-status requirement.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    name: Manual stable tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run stable tests
        run: npx vitest run --config vitest.stable.config.ts
        env:
          CI: true
          TZ: UTC

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: |
            .test-results
            coverage
          if-no-files-found: ignore
